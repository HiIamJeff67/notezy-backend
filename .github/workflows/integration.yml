name: Notezy Integration Verification

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  NOTEZY_RUN_INTEGRATION: '1'
  KAFKA_BROKERS: 127.0.0.1:19094

jobs:
  integration:
    name: Docker Compose integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Start integration Compose stack
        run: make compose-integration-up
      - name: Run root integration tests
        run: |
          set -o pipefail
          mkdir -p integration-results
          make test-integration 2>&1 | tee integration-results/root-integration.log
      - name: Run Core and DurableJob Kafka flow
        run: |
          set -o pipefail
          make test-integration-kafka 2>&1 | tee integration-results/kafka-integration.log
      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-reports-${{ github.run_id }}
          path: integration-results/
          retention-days: 14
      - name: Stop integration Compose stack
        if: always()
        run: make compose-integration-down
