services:
  notezy-redis:
    container_name: ${DOCKER_REDIS_SERVICE_NAME}
    # restart: always
    image: redis:7.2.3-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "${REDIS_PORT}:${DOCKER_REDIS_PORT}"
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        else
          exec redis-server --appendonly yes
        fi
    networks:
      notezy-backend-net:
        ipv4_address: 172.30.0.13
    volumes:
      - redis-data:/data

  notezy-db:
    # should be the same as DB_HOST(hosting service)
    container_name: ${DOCKER_DB_SERVICE_NAME}
    # restart: always
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:${DOCKER_DB_PORT}"
    networks:
      notezy-backend-net:
        ipv4_address: 172.30.0.12
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 6

  notezy-kafka:
    container_name: ${DOCKER_KAFKA_SERVICE_NAME:-notezy-kafka}
    image: apache/kafka:4.0.0
    environment:
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@notezy-kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://notezy-kafka:9092,CONTROLLER://notezy-kafka:9093,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://notezy-kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "${KAFKA_HOST_PORT:-9094}:9094"
    networks:
      notezy-backend-net:
        ipv4_address: 172.30.0.23
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server notezy-kafka:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  notezy-kafka-init:
    container_name: ${DOCKER_KAFKA_INIT_SERVICE_NAME:-notezy-kafka-init}
    image: apache/kafka:4.0.0
    command:
      - bash
      - -ec
      - |
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server notezy-kafka:9092 \
          --create \
          --if-not-exists \
          --topic notezy.core.lifecycle.v1 \
          --partitions 3 \
          --replication-factor 1 \
          --config cleanup.policy=delete \
          --config retention.ms=604800000 \
          --config min.insync.replicas=1
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server notezy-kafka:9092 \
          --create \
          --if-not-exists \
          --topic notezy.core.lifecycle.v1.dlq \
          --partitions 3 \
          --replication-factor 1 \
          --config cleanup.policy=delete \
          --config retention.ms=2592000000 \
          --config min.insync.replicas=1
        for topic in notezy.yjsworker.core.command.v1 \
          notezy.core.yjsworker.reply.v1 \
          notezy.core.durablejob.yjs-maintenance-hint.v1 \
          notezy.durablejob.core.yjs-maintenance-request.v1 \
          notezy.core.yjsworker.maintenance-command.v1 \
          notezy.yjsworker.core.maintenance-result.v1 \
          notezy.core.durablejob.yjs-maintenance-result.v1; do
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server notezy-kafka:9092 \
            --create \
            --if-not-exists \
            --topic "$$topic" \
            --partitions 3 \
            --replication-factor 1 \
            --config cleanup.policy=delete \
            --config retention.ms=604800000 \
            --config min.insync.replicas=1
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server notezy-kafka:9092 \
            --create \
            --if-not-exists \
            --topic "$$topic.dlq" \
            --partitions 3 \
            --replication-factor 1 \
            --config cleanup.policy=delete \
            --config retention.ms=2592000000 \
            --config min.insync.replicas=1
        done
    networks:
      - notezy-backend-net
    depends_on:
      notezy-kafka:
        condition: service_healthy
    restart: "no"

  notezy-gateway:
    container_name: ${DOCKER_GATEWAY_SERVICE_NAME:-notezy-gateway}
    image: ${DOCKER_GATEWAY_SERVICE_NAME:-notezy-gateway}:latest
    # restart: always
    build:
      context: .
      dockerfile: internal/gateway/Dockerfile
      target: dev
    networks:
      notezy-backend-net:
        ipv4_address: 172.30.0.11
    volumes:
      - .:/notezy-backend
      - /notezy-backend/tmp
    working_dir: /notezy-backend/internal/gateway
    command: ["air", "-c", ".air.toml"]
    # env_file: .env # this will allowed all the environment variables from .env file be callable in our backend codespace
    environment:
      REDIS_HOST: ${DOCKER_REDIS_SERVICE_NAME}
      REDIS_PORT: ${DOCKER_REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_INIT_DB: ${REDIS_INIT_DB:-0}
      GATEWAY_LISTEN_ADDRESS: 0.0.0.0:${DOCKER_GIN_PORT}
      GIN_TRUSTED_PROXIES: ${GIN_TRUSTED_PROXIES}
      JWT_ACCESS_TOKEN_SECRET_KEY: ${JWT_ACCESS_TOKEN_SECRET_KEY}
      JWT_REFRESH_TOKEN_SECRET_KEY: ${JWT_REFRESH_TOKEN_SECRET_KEY}
      CORE_DELEGATION_SECRET: ${CORE_DELEGATION_SECRET}
      CORE_DELEGATION_AUDIENCE: ${CORE_DELEGATION_AUDIENCE}
      CORE_DELEGATION_ISSUER: ${CORE_DELEGATION_ISSUER}
      CORE_BASE_URL: http://notezy-core:7778
      CORE_CLIENT_TIMEOUT: ${CORE_CLIENT_TIMEOUT:-10s}
      OTEL_SERVICE_NAME: notezy-gateway
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-development}
      OTEL_DEPLOYMENT_ENVIRONMENT: development
      OTEL_EXPORTER_OTLP_GRPC_ENDPOINT: ${DOCKER_OTEL_COLLECTOR_SERVICE_NAME}:${DOCKER_OTEL_COLLECTOR_GRPC_PORT}
      ALLOWED_DOMAINS: ${ALLOWED_DOMAINS}
    expose:
      - "${GIN_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${DOCKER_GIN_PORT}/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      notezy-core:
        condition: service_healthy

  notezy-core:
    container_name: ${DOCKER_CORE_SERVICE_NAME:-notezy-core}
    image: ${DOCKER_CORE_SERVICE_NAME:-notezy-core}:latest
    build:
      context: .
      dockerfile: internal/core/Dockerfile
      target: dev
    command: ["go", "run", "./internal/core/commands"]
    networks:
      notezy-backend-net:
        ipv4_address: 172.30.0.20
    volumes:
      - .:/notezy-backend
      - /notezy-backend/tmp
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DOCKER_DB_PORT: ${DOCKER_DB_PORT}
      REDIS_HOST: ${DOCKER_REDIS_SERVICE_NAME}
      REDIS_PORT: ${DOCKER_REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_INIT_DB: ${REDIS_INIT_DB:-0}
      CORE_USER_DATA_CACHE_EXPIRES_IN: ${CORE_USER_DATA_CACHE_EXPIRES_IN:-1h}
      KAFKA_BROKERS: notezy-kafka:9092
      KAFKA_CLIENT_ID: notezy-core
      KAFKA_CONSUMER_GROUP: notezy-core
      KAFKA_DIAL_TIMEOUT: ${KAFKA_DIAL_TIMEOUT:-3s}
      KAFKA_TLS_ENABLED: ${KAFKA_TLS_ENABLED:-false}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      CORE_LISTEN_ADDRESS: 0.0.0.0:7778
      JWT_ACCESS_TOKEN_SECRET_KEY: ${JWT_ACCESS_TOKEN_SECRET_KEY}
      JWT_REFRESH_TOKEN_SECRET_KEY: ${JWT_REFRESH_TOKEN_SECRET_KEY}
      CSRF_TOKEN_SECRET_KEY: ${CSRF_TOKEN_SECRET_KEY}
      CORE_DELEGATION_SECRET: ${CORE_DELEGATION_SECRET}
      CORE_DELEGATION_AUDIENCE: ${CORE_DELEGATION_AUDIENCE}
      CORE_DELEGATION_ISSUER: ${CORE_DELEGATION_ISSUER}
      REALTIME_TICKET_PRIVATE_KEY_BASE64: ${REALTIME_TICKET_PRIVATE_KEY_BASE64}
      STORAGE_KEY_SALT: ${STORAGE_KEY_SALT}
      KAFKA_CONSUMER_MAXIMUM_ATTEMPTS: ${KAFKA_CONSUMER_MAXIMUM_ATTEMPTS:-3}
      KAFKA_CONSUMER_INITIAL_RETRY_BACKOFF: ${KAFKA_CONSUMER_INITIAL_RETRY_BACKOFF:-250ms}
      KAFKA_CONSUMER_MAXIMUM_RETRY_BACKOFF: ${KAFKA_CONSUMER_MAXIMUM_RETRY_BACKOFF:-5s}
      KAFKA_CONSUMER_MAXIMUM_POLL_RECORDS: ${KAFKA_CONSUMER_MAXIMUM_POLL_RECORDS:-100}
      OUTBOX_RELAY_BATCH_SIZE: ${OUTBOX_RELAY_BATCH_SIZE:-100}
      OUTBOX_RELAY_POLL_INTERVAL: ${OUTBOX_RELAY_POLL_INTERVAL:-1s}
      OUTBOX_RELAY_CLAIM_TIMEOUT: ${OUTBOX_RELAY_CLAIM_TIMEOUT:-30s}
      OUTBOX_RELAY_INITIAL_BACKOFF: ${OUTBOX_RELAY_INITIAL_BACKOFF:-1s}
      OUTBOX_RELAY_MAXIMUM_BACKOFF: ${OUTBOX_RELAY_MAXIMUM_BACKOFF:-1m}
      OUTBOX_RELAY_RETENTION: ${OUTBOX_RELAY_RETENTION:-168h}
      OUTBOX_RELAY_CLEANUP_INTERVAL: ${OUTBOX_RELAY_CLEANUP_INTERVAL:-1h}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET}
      OAUTH_GOOGLE_REDIRECT_URL: ${OAUTH_GOOGLE_REDIRECT_URL}
      OTEL_SERVICE_NAME: notezy-core
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-development}
      OTEL_DEPLOYMENT_ENVIRONMENT: development
      OTEL_EXPORTER_OTLP_GRPC_ENDPOINT: ${DOCKER_OTEL_COLLECTOR_SERVICE_NAME}:${DOCKER_OTEL_COLLECTOR_GRPC_PORT}
    expose:
      - "7778"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7778/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      notezy-db:
        condition: service_healthy
      notezy-yjs-worker:
        condition: service_healthy
      notezy-kafka:
        condition: service_healthy

  notezy-realtime-gateway:
    container_name: ${DOCKER_REALTIME_GATEWAY_SERVICE_NAME:-notezy-realtime-gateway}
    image: ${DOCKER_REALTIME_GATEWAY_SERVICE_NAME:-notezy-realtime-gateway}:latest
    build:
      context: .
      dockerfile: internal/realtimegateway/Dockerfile
      target: dev
    command: ["go", "run", "./commands"]
    networks:
      notezy-backend-net:
        ipv4_address: 172.30.0.21
    volumes:
      - .:/notezy-backend
      - /notezy-backend/tmp
    working_dir: /notezy-backend/internal/realtimegateway
    environment:
      REDIS_HOST: ${DOCKER_REDIS_SERVICE_NAME}
      REDIS_PORT: ${DOCKER_REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_INIT_DB: ${REDIS_INIT_DB:-0}
      KAFKA_BROKERS: notezy-kafka:9092
      KAFKA_CLIENT_ID: notezy-realtime-gateway
      KAFKA_CONSUMER_GROUP: notezy-realtimegateway-lifecycle-v1
      KAFKA_DIAL_TIMEOUT: ${KAFKA_DIAL_TIMEOUT:-3s}
      KAFKA_TLS_ENABLED: ${KAFKA_TLS_ENABLED:-false}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      KAFKA_CONSUMER_MAXIMUM_ATTEMPTS: ${KAFKA_CONSUMER_MAXIMUM_ATTEMPTS:-3}
      KAFKA_CONSUMER_INITIAL_RETRY_BACKOFF: ${KAFKA_CONSUMER_INITIAL_RETRY_BACKOFF:-250ms}
      KAFKA_CONSUMER_MAXIMUM_RETRY_BACKOFF: ${KAFKA_CONSUMER_MAXIMUM_RETRY_BACKOFF:-5s}
      KAFKA_CONSUMER_MAXIMUM_POLL_RECORDS: ${KAFKA_CONSUMER_MAXIMUM_POLL_RECORDS:-100}
      CORE_BASE_URL: http://notezy-core:7778
      CORE_DELEGATION_SECRET: ${CORE_DELEGATION_SECRET}
      CORE_DELEGATION_AUDIENCE: ${CORE_DELEGATION_AUDIENCE}
      CORE_DELEGATION_ISSUER: ${CORE_DELEGATION_ISSUER}
      REALTIME_TICKET_PRIVATE_KEY_BASE64: ${REALTIME_TICKET_PRIVATE_KEY_BASE64}
      REALTIME_ENABLED: ${REALTIME_ENABLED:-true}
      REALTIME_BETA_USER_PUBLIC_IDS: ${REALTIME_BETA_USER_PUBLIC_IDS:-}
      YJS_WORKER_URLS: ${YJS_WORKER_URLS}
      REALTIME_GATEWAY_LISTEN_ADDRESS: ${REALTIME_GATEWAY_LISTEN_ADDRESS:-0.0.0.0:7779}
      GIN_TRUSTED_PROXIES: ${GIN_TRUSTED_PROXIES}
      ALLOWED_DOMAINS: ${ALLOWED_DOMAINS}
      OTEL_SERVICE_NAME: notezy-realtime-gateway
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-development}
      OTEL_DEPLOYMENT_ENVIRONMENT: development
      OTEL_EXPORTER_OTLP_GRPC_ENDPOINT: ${DOCKER_OTEL_COLLECTOR_SERVICE_NAME}:${DOCKER_OTEL_COLLECTOR_GRPC_PORT}
    expose:
      - "7779"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7779/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      notezy-core:
        condition: service_healthy
      notezy-yjs-worker:
        condition: service_healthy
      notezy-kafka:
        condition: service_healthy

  notezy-durable-job:
    container_name: ${DOCKER_DURABLE_JOB_SERVICE_NAME:-notezy-durable-job}
    image: ${DOCKER_DURABLE_JOB_SERVICE_NAME:-notezy-durable-job}:latest
    build:
      context: .
      dockerfile: internal/durablejob/Dockerfile
      target: dev
    command: ["go", "run", "./commands"]
    networks:
      notezy-backend-net:
        ipv4_address: 172.30.0.22
    volumes:
      - .:/notezy-backend
      - /notezy-backend/tmp
    working_dir: /notezy-backend/internal/durablejob
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DOCKER_DB_PORT: ${DOCKER_DB_PORT}
      KAFKA_BROKERS: notezy-kafka:9092
      KAFKA_DIAL_TIMEOUT: ${KAFKA_DIAL_TIMEOUT:-3s}
      KAFKA_TLS_ENABLED: ${KAFKA_TLS_ENABLED:-false}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      DURABLEJOB_LISTEN_ADDRESS: 0.0.0.0:8082
      KAFKA_CONSUMER_MAXIMUM_ATTEMPTS: ${KAFKA_CONSUMER_MAXIMUM_ATTEMPTS:-3}
      KAFKA_CONSUMER_INITIAL_RETRY_BACKOFF: ${KAFKA_CONSUMER_INITIAL_RETRY_BACKOFF:-250ms}
      KAFKA_CONSUMER_MAXIMUM_RETRY_BACKOFF: ${KAFKA_CONSUMER_MAXIMUM_RETRY_BACKOFF:-5s}
      KAFKA_CONSUMER_MAXIMUM_POLL_RECORDS: ${KAFKA_CONSUMER_MAXIMUM_POLL_RECORDS:-100}
      DURABLEJOB_YJS_MAINTENANCE_MAXIMUM_PENDING_HINTS: ${DURABLEJOB_YJS_MAINTENANCE_MAXIMUM_PENDING_HINTS:-1000}
      DURABLEJOB_YJS_MAINTENANCE_MAXIMUM_DISPATCH_BATCH: ${DURABLEJOB_YJS_MAINTENANCE_MAXIMUM_DISPATCH_BATCH:-32}
      DURABLEJOB_YJS_MAINTENANCE_MAXIMUM_DISPATCH_WORKERS: ${DURABLEJOB_YJS_MAINTENANCE_MAXIMUM_DISPATCH_WORKERS:-8}
      DURABLEJOB_YJS_MAINTENANCE_MAXIMUM_REQUEST_ATTEMPTS: ${DURABLEJOB_YJS_MAINTENANCE_MAXIMUM_REQUEST_ATTEMPTS:-3}
      OTEL_SERVICE_NAME: notezy-durable-job
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-development}
      OTEL_DEPLOYMENT_ENVIRONMENT: development
      OTEL_EXPORTER_OTLP_GRPC_ENDPOINT: ${DOCKER_OTEL_COLLECTOR_SERVICE_NAME}:${DOCKER_OTEL_COLLECTOR_GRPC_PORT}
    expose:
      - "8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8082/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      notezy-db:
        condition: service_healthy
      notezy-core:
        condition: service_healthy
      notezy-yjs-worker:
        condition: service_healthy

  notezy-email:
    container_name: ${DOCKER_EMAIL_SERVICE_NAME:-notezy-email}
    image: ${DOCKER_EMAIL_SERVICE_NAME:-notezy-email}:latest
    build:
      context: .
      dockerfile: internal/email/Dockerfile
      target: dev
    command: ["go", "run", "./commands"]
    networks:
      notezy-backend-net:
        ipv4_address: 172.30.0.19
    volumes:
      - .:/notezy-backend
      - /notezy-backend/tmp
    working_dir: /notezy-backend/internal/email
    environment:
      EMAIL_LISTEN_ADDRESS: 0.0.0.0:8081
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      NOTEZY_OFFICIAL_NAME: ${NOTEZY_OFFICIAL_NAME}
      NOTEZY_OFFICIAL_GMAIL: ${NOTEZY_OFFICIAL_GMAIL}
      NOTEZY_OFFICIAL_GOOGLE_PASSWORD: ${NOTEZY_OFFICIAL_GOOGLE_PASSWORD}
      NOTEZY_OFFICIAL_GOOGLE_APPLICATION_PASSWORD: ${NOTEZY_OFFICIAL_GOOGLE_APPLICATION_PASSWORD}
      KAFKA_BROKERS: notezy-kafka:9092
      KAFKA_DIAL_TIMEOUT: ${KAFKA_DIAL_TIMEOUT:-3s}
      KAFKA_TLS_ENABLED: ${KAFKA_TLS_ENABLED:-false}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      KAFKA_CONSUMER_MAXIMUM_ATTEMPTS: ${KAFKA_CONSUMER_MAXIMUM_ATTEMPTS:-3}
      KAFKA_CONSUMER_INITIAL_RETRY_BACKOFF: ${KAFKA_CONSUMER_INITIAL_RETRY_BACKOFF:-250ms}
      KAFKA_CONSUMER_MAXIMUM_RETRY_BACKOFF: ${KAFKA_CONSUMER_MAXIMUM_RETRY_BACKOFF:-5s}
      KAFKA_CONSUMER_MAXIMUM_POLL_RECORDS: ${KAFKA_CONSUMER_MAXIMUM_POLL_RECORDS:-100}
      OTEL_SERVICE_NAME: notezy-email
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-development}
      OTEL_DEPLOYMENT_ENVIRONMENT: development
      OTEL_EXPORTER_OTLP_GRPC_ENDPOINT: ${DOCKER_OTEL_COLLECTOR_SERVICE_NAME}:${DOCKER_OTEL_COLLECTOR_GRPC_PORT}
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      notezy-otel-collector:
        condition: service_started
      notezy-kafka:
        condition: service_healthy

  notezy-yjs-worker:
    image: ${DOCKER_YJS_WORKER_SERVICE_NAME}:latest
    build:
      context: .
      dockerfile: internal/yjsworker/Dockerfile
    environment:
      NODE_ENV: development
      YJS_WORKER_HOST: 0.0.0.0
      YJS_WORKER_PORT: ${DOCKER_YJS_WORKER_PORT}
      KAFKA_BROKERS: notezy-kafka:9092
      KAFKA_CLIENT_ID: notezy-yjs-worker
      YJS_WORKER_COMMAND_TIMEOUT_MILLISECONDS: ${YJS_WORKER_COMMAND_TIMEOUT_MILLISECONDS:-10000}
      OTEL_SERVICE_NAME: notezy-yjs-worker
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-development}
      OTEL_DEPLOYMENT_ENVIRONMENT: development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://${DOCKER_OTEL_COLLECTOR_SERVICE_NAME}:${DOCKER_OTEL_COLLECTOR_HTTP_PORT}
    networks:
      - notezy-backend-net
    expose:
      - "${DOCKER_YJS_WORKER_PORT}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + process.env.YJS_WORKER_PORT + '/healthz').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      notezy-kafka:
        condition: service_healthy

  notezy-nginx:
    image: nginx:1.27-alpine
    container_name: ${DOCKER_NGINX_SERVICE_NAME}
    ports:
      - "${NGINX_HTTP_PORT}:${DOCKER_NGINX_HTTP_PORT}"
    networks:
      notezy-backend-net:
        ipv4_address: 172.30.0.10
    volumes:
      - ./infra/nginx/default.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      notezy-gateway:
        condition: service_healthy
      notezy-realtime-gateway:
        condition: service_healthy

  notezy-loki:
    container_name: ${DOCKER_LOKI_SERVICE_NAME}
    image: grafana/loki:latest
    command: ["-config.file=/etc/loki.yaml", "-config.expand-env=true"]
    ports:
      - "${LOKI_PORT}:${DOCKER_LOKI_PORT}"
    environment:
      DOCKER_LOKI_PORT: ${DOCKER_LOKI_PORT}
    networks:
      notezy-backend-net:
        ipv4_address: 172.30.0.14
    volumes:
      - ./infra/monitor/loki-config.dev.yaml:/etc/loki.yaml
      - loki-data:/loki
    # healthcheck:
    #   test:
    #     [
    #       "CMD-SHELL",
    #       "wget --no-verbose --tries=1 --spider http://localhost:${DOCKER_LOKI_PORT}/ready || exit 1",
    #     ]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 12

  notezy-tempo:
    container_name: ${DOCKER_TEMPO_SERVICE_NAME}
    image: grafana/tempo:2.9.1
    command: ["-config.file=/etc/tempo.yaml", "-config.expand-env=true"]
    environment:
      DOCKER_TEMPO_PORT: ${DOCKER_TEMPO_PORT}
      DOCKER_OTEL_COLLECTOR_GRPC_PORT: ${DOCKER_OTEL_COLLECTOR_GRPC_PORT}
      DOCKER_OTEL_COLLECTOR_HTTP_PORT: ${DOCKER_OTEL_COLLECTOR_HTTP_PORT}
      DOCKER_MIMIR_SERVICE_NAME: ${DOCKER_MIMIR_SERVICE_NAME}
      DOCKER_MIMIR_PORT: ${DOCKER_MIMIR_PORT}
    ports:
      - "${TEMPO_PORT}:${DOCKER_TEMPO_PORT}"
    networks:
      notezy-backend-net:
        ipv4_address: 172.30.0.15
    volumes:
      - ./infra/monitor/tempo-config.dev.yaml:/etc/tempo.yaml
      - tempo-data:/var/tempo
    depends_on:
      notezy-mimir:
        condition: service_started

  notezy-mimir-init:
    image: busybox:1.37.0
    command:
      - sh
      - -ec
      - |
        mkdir -p \
          /data/mimir/blocks \
          /data/mimir/tsdb \
          /data/mimir/sync \
          /data/mimir/compactor \
          /data/mimir/alertmanager \
          /data/mimir/alertmanager-configs
    volumes:
      - mimir-data:/data/mimir
    restart: "no"

  notezy-mimir:
    container_name: ${DOCKER_MIMIR_SERVICE_NAME}
    image: grafana/mimir:latest
    command:
      ["-config.file=/etc/mimir.yaml", "-target=all,alertmanager", "-config.expand-env=true"]
    volumes:
      - ./infra/monitor/mimir-config.dev.yaml:/etc/mimir.yaml
      - ./infra/monitor/alertmanager-fallback.dev.yaml:/etc/mimir/alertmanager-fallback.yaml:ro
      - ./infra/monitor/alerts:/etc/mimir/rules/anonymous:ro
      - mimir-data:/data/mimir
    environment:
      DOCKER_MIMIR_PORT: ${DOCKER_MIMIR_PORT}
    ports:
      - "${MIMIR_PORT}:${DOCKER_MIMIR_PORT}"
    depends_on:
      notezy-mimir-init:
        condition: service_completed_successfully
    networks:
      notezy-backend-net:
        ipv4_address: 172.30.0.16
    # healthcheck:
    #   test:
    #     [
    #       "CMD-SHELL",
    #       "wget --no-verbose --tries=1 --spider http://localhost:${DOCKER_MIMIR_PORT}/ready || exit 1",
    #     ]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 6
    #   start_period: 30s

  notezy-otel-collector:
    container_name: ${DOCKER_OTEL_COLLECTOR_SERVICE_NAME}
    image: otel/opentelemetry-collector-contrib:latest
    environment:
      DOCKER_LOKI_SERVICE_NAME: ${DOCKER_LOKI_SERVICE_NAME}
      DOCKER_TEMPO_SERVICE_NAME: ${DOCKER_TEMPO_SERVICE_NAME}
      DOCKER_MIMIR_SERVICE_NAME: ${DOCKER_MIMIR_SERVICE_NAME}
      DOCKER_OTEL_COLLECTOR_GRPC_PORT: ${DOCKER_OTEL_COLLECTOR_GRPC_PORT}
      DOCKER_OTEL_COLLECTOR_HTTP_PORT: ${DOCKER_OTEL_COLLECTOR_HTTP_PORT}
    ports:
      - "${OTEL_COLLECTOR_GRPC_PORT}:${DOCKER_OTEL_COLLECTOR_GRPC_PORT}" # OTLP gRPC
      - "${OTEL_COLLECTOR_HTTP_PORT}:${DOCKER_OTEL_COLLECTOR_HTTP_PORT}" # OTLP HTTP
    networks:
      notezy-backend-net:
        ipv4_address: 172.30.0.17
    volumes:
      - ./infra/monitor/otel-collector-config.dev.yaml:/etc/otelcol-contrib/config.yaml
    depends_on:
      notezy-loki:
        condition: service_started
      notezy-mimir:
        condition: service_started
      notezy-tempo:
        condition: service_started

  notezy-grafana:
    container_name: ${DOCKER_GRAFANA_SERVICE_NAME}
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_FEATURE_TOGGLE_ENABLE: ${GF_FEATURE_TOGGLE_ENABLE}
      DOCKER_MIMIR_SERVICE_NAME: ${DOCKER_MIMIR_SERVICE_NAME}
      DOCKER_MIMIR_PORT: ${DOCKER_MIMIR_PORT}
      DOCKER_TEMPO_SERVICE_NAME: ${DOCKER_TEMPO_SERVICE_NAME}
      DOCKER_TEMPO_PORT: ${DOCKER_TEMPO_PORT}
      DOCKER_LOKI_SERVICE_NAME: ${DOCKER_LOKI_SERVICE_NAME}
      DOCKER_LOKI_PORT: ${DOCKER_LOKI_PORT}
    ports:
      - "${GRAFANA_PORT}:${DOCKER_GRAFANA_PORT}"
    networks:
      notezy-backend-net:
        ipv4_address: 172.30.0.18
    volumes:
      - ./infra/monitor/grafana/datasources.dev.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./infra/monitor/grafana/dashboards.dev.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./infra/monitor/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - notezy-loki
      - notezy-tempo
      - notezy-mimir

networks:
  notezy-backend-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16

volumes:
  redis-data:
    name: notezy-backend-redis-data
  # api-data:
  #   name: notezy-backend-api-data
  postgres-data:
    name: notezy-backend-postgres-data
  postgres-test-data:
    name: notezy-backend-postgres-test-data
  kafka-data:
    name: notezy-backend-kafka-data
  loki-data:
    name: notezy-backend-loki-data
  tempo-data:
    name: notezy-backend-tempo-data
  mimir-data:
    name: notezy-backend-mimir-data
