services:
  notezy-redis:
    container_name: ${DOCKER_REDIS_SERVICE_NAME}
    # restart: always
    image: redis:7.2.3-alpine
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]

  notezy-db:
    # should be the same as DB_HOST(hosting service)
    container_name: ${DOCKER_DB_SERVICE_NAME}
    # restart: always
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  notezy-gateway:
    container_name: ${DOCKER_GATEWAY_SERVICE_NAME:-notezy-gateway}
    image: ${GATEWAY_IMAGE:-notezy-gateway:latest}
    # restart: always
    build:
      context: .
      dockerfile: internal/gateway/Dockerfile
      target: production
    # entrypoint: ["${ENTRYPOINT_CMD}"]
    environment:
      REDIS_HOST: ${DOCKER_REDIS_SERVICE_NAME}
      REDIS_PORT: ${DOCKER_REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_INIT_DB: ${REDIS_INIT_DB:-0}
      GATEWAY_RATE_LIMIT_RECORD_CACHE_SERVER_START: ${GATEWAY_RATE_LIMIT_RECORD_CACHE_SERVER_START:-4}
      GATEWAY_RATE_LIMIT_RECORD_CACHE_SERVER_SIZE: ${GATEWAY_RATE_LIMIT_RECORD_CACHE_SERVER_SIZE:-4}
      GATEWAY_LISTEN_ADDRESS: 0.0.0.0:${DOCKER_GIN_PORT}
      GIN_TRUSTED_PROXIES: ${GIN_TRUSTED_PROXIES}
      JWT_ACCESS_TOKEN_SECRET_KEY: ${JWT_ACCESS_TOKEN_SECRET_KEY}
      JWT_REFRESH_TOKEN_SECRET_KEY: ${JWT_REFRESH_TOKEN_SECRET_KEY}
      CORE_DELEGATION_SECRET: ${CORE_DELEGATION_SECRET}
      CORE_DELEGATION_AUDIENCE: ${CORE_DELEGATION_AUDIENCE}
      CORE_DELEGATION_ISSUER: ${CORE_DELEGATION_ISSUER}
      CORE_BASE_URL: ${CORE_BASE_URL:-http://notezy-core:7778}
      CORE_CLIENT_TIMEOUT: ${CORE_CLIENT_TIMEOUT:-10s}
      OTEL_SERVICE_NAME: notezy-gateway
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-unknown}
      OTEL_DEPLOYMENT_ENVIRONMENT: production
      OTEL_EXPORTER_OTLP_GRPC_ENDPOINT: ${OTEL_EXPORTER_OTLP_GRPC_ENDPOINT}
      ALLOWED_DOMAINS: ${ALLOWED_DOMAINS}
    ports:
      - "${GIN_PORT}:${DOCKER_GIN_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${DOCKER_GIN_PORT}/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      notezy-core:
        condition: service_healthy

  notezy-core:
    container_name: ${DOCKER_CORE_SERVICE_NAME:-notezy-core}
    image: ${CORE_IMAGE:-notezy-core:latest}
    build:
      context: .
      dockerfile: internal/core/Dockerfile
      target: production
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DOCKER_DB_PORT: ${DOCKER_DB_PORT}
      REDIS_HOST: ${DOCKER_REDIS_SERVICE_NAME}
      REDIS_PORT: ${DOCKER_REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_INIT_DB: ${REDIS_INIT_DB:-0}
      CORE_USER_DATA_CACHE_SERVER_START: ${CORE_USER_DATA_CACHE_SERVER_START:-0}
      CORE_USER_DATA_CACHE_SERVER_SIZE: ${CORE_USER_DATA_CACHE_SERVER_SIZE:-4}
      CORE_USER_DATA_CACHE_EXPIRES_IN: ${CORE_USER_DATA_CACHE_EXPIRES_IN:-1h}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-notezy-kafka:9092}
      KAFKA_DIAL_TIMEOUT: ${KAFKA_DIAL_TIMEOUT:-3s}
      KAFKA_TLS_ENABLED: ${KAFKA_TLS_ENABLED:-false}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      CORE_LISTEN_ADDRESS: 0.0.0.0:7778
      JWT_ACCESS_TOKEN_SECRET_KEY: ${JWT_ACCESS_TOKEN_SECRET_KEY}
      JWT_REFRESH_TOKEN_SECRET_KEY: ${JWT_REFRESH_TOKEN_SECRET_KEY}
      CORE_DELEGATION_SECRET: ${CORE_DELEGATION_SECRET}
      CORE_DELEGATION_AUDIENCE: ${CORE_DELEGATION_AUDIENCE}
      CORE_DELEGATION_ISSUER: ${CORE_DELEGATION_ISSUER}
      REALTIME_TICKET_PRIVATE_KEY_BASE64: ${REALTIME_TICKET_PRIVATE_KEY_BASE64}
      STORAGE_KEY_SALT: ${STORAGE_KEY_SALT}
      KAFKA_CONSUMER_MAXIMUM_ATTEMPTS: ${KAFKA_CONSUMER_MAXIMUM_ATTEMPTS:-3}
      KAFKA_CONSUMER_INITIAL_RETRY_BACKOFF: ${KAFKA_CONSUMER_INITIAL_RETRY_BACKOFF:-250ms}
      KAFKA_CONSUMER_MAXIMUM_RETRY_BACKOFF: ${KAFKA_CONSUMER_MAXIMUM_RETRY_BACKOFF:-5s}
      KAFKA_CONSUMER_MAXIMUM_POLL_RECORDS: ${KAFKA_CONSUMER_MAXIMUM_POLL_RECORDS:-100}
      OUTBOX_RELAY_BATCH_SIZE: ${OUTBOX_RELAY_BATCH_SIZE:-100}
      OUTBOX_RELAY_POLL_INTERVAL: ${OUTBOX_RELAY_POLL_INTERVAL:-1s}
      OUTBOX_RELAY_CLAIM_TIMEOUT: ${OUTBOX_RELAY_CLAIM_TIMEOUT:-30s}
      OUTBOX_RELAY_INITIAL_BACKOFF: ${OUTBOX_RELAY_INITIAL_BACKOFF:-1s}
      OUTBOX_RELAY_MAXIMUM_BACKOFF: ${OUTBOX_RELAY_MAXIMUM_BACKOFF:-1m}
      OUTBOX_RELAY_RETENTION: ${OUTBOX_RELAY_RETENTION:-168h}
      OUTBOX_RELAY_CLEANUP_INTERVAL: ${OUTBOX_RELAY_CLEANUP_INTERVAL:-1h}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET}
      OAUTH_GOOGLE_REDIRECT_URL: ${OAUTH_GOOGLE_REDIRECT_URL}
      OTEL_SERVICE_NAME: notezy-core
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-unknown}
      OTEL_DEPLOYMENT_ENVIRONMENT: production
      OTEL_EXPORTER_OTLP_GRPC_ENDPOINT: ${OTEL_EXPORTER_OTLP_GRPC_ENDPOINT}
    expose:
      - "7778"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7778/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      notezy-db:
        condition: service_healthy
      notezy-yjs-worker:
        condition: service_healthy

  notezy-realtime-gateway:
    container_name: ${DOCKER_REALTIME_GATEWAY_SERVICE_NAME:-notezy-realtime-gateway}
    image: ${REALTIME_GATEWAY_IMAGE:-notezy-realtime-gateway:latest}
    build:
      context: .
      dockerfile: internal/realtimegateway/Dockerfile
      target: production
    environment:
      REDIS_HOST: ${DOCKER_REDIS_SERVICE_NAME}
      REDIS_PORT: ${DOCKER_REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_INIT_DB: ${REDIS_INIT_DB:-0}
      REALTIME_GATEWAY_RATE_LIMIT_RECORD_CACHE_SERVER_START: ${REALTIME_GATEWAY_RATE_LIMIT_RECORD_CACHE_SERVER_START:-9}
      REALTIME_GATEWAY_RATE_LIMIT_RECORD_CACHE_SERVER_SIZE: ${REALTIME_GATEWAY_RATE_LIMIT_RECORD_CACHE_SERVER_SIZE:-4}
      REALTIME_GATEWAY_REALTIME_LEASE_CACHE_SERVER_START: ${REALTIME_GATEWAY_REALTIME_LEASE_CACHE_SERVER_START:-8}
      REALTIME_GATEWAY_REALTIME_LEASE_CACHE_SERVER_SIZE: ${REALTIME_GATEWAY_REALTIME_LEASE_CACHE_SERVER_SIZE:-1}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-notezy-kafka:9092}
      KAFKA_DIAL_TIMEOUT: ${KAFKA_DIAL_TIMEOUT:-3s}
      KAFKA_TLS_ENABLED: ${KAFKA_TLS_ENABLED:-false}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      KAFKA_CONSUMER_MAXIMUM_ATTEMPTS: ${KAFKA_CONSUMER_MAXIMUM_ATTEMPTS:-3}
      KAFKA_CONSUMER_INITIAL_RETRY_BACKOFF: ${KAFKA_CONSUMER_INITIAL_RETRY_BACKOFF:-250ms}
      KAFKA_CONSUMER_MAXIMUM_RETRY_BACKOFF: ${KAFKA_CONSUMER_MAXIMUM_RETRY_BACKOFF:-5s}
      KAFKA_CONSUMER_MAXIMUM_POLL_RECORDS: ${KAFKA_CONSUMER_MAXIMUM_POLL_RECORDS:-100}
      CORE_BASE_URL: ${CORE_BASE_URL:-http://notezy-core:7778}
      CORE_DELEGATION_SECRET: ${CORE_DELEGATION_SECRET}
      CORE_DELEGATION_AUDIENCE: ${CORE_DELEGATION_AUDIENCE}
      CORE_DELEGATION_ISSUER: ${CORE_DELEGATION_ISSUER}
      REALTIME_TICKET_PRIVATE_KEY_BASE64: ${REALTIME_TICKET_PRIVATE_KEY_BASE64}
      REALTIME_ENABLED: ${REALTIME_ENABLED:-true}
      REALTIME_BETA_USER_PUBLIC_IDS: ${REALTIME_BETA_USER_PUBLIC_IDS:-}
      YJS_WORKER_URLS: ws://notezy-yjs-worker:${DOCKER_YJS_WORKER_PORT:-8787}/internal/realtime/v1
      REALTIME_GATEWAY_LISTEN_ADDRESS: ${REALTIME_GATEWAY_LISTEN_ADDRESS:-0.0.0.0:7779}
      GIN_TRUSTED_PROXIES: ${GIN_TRUSTED_PROXIES}
      ALLOWED_DOMAINS: ${ALLOWED_DOMAINS}
      OTEL_SERVICE_NAME: notezy-realtime-gateway
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-unknown}
      OTEL_DEPLOYMENT_ENVIRONMENT: production
      OTEL_EXPORTER_OTLP_GRPC_ENDPOINT: ${OTEL_EXPORTER_OTLP_GRPC_ENDPOINT}
    expose:
      - "7779"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7779/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      notezy-core:
        condition: service_healthy
      notezy-yjs-worker:
        condition: service_healthy

  notezy-durable-job:
    container_name: ${DOCKER_DURABLE_JOB_SERVICE_NAME:-notezy-durable-job}
    image: ${DURABLE_JOB_IMAGE:-notezy-durable-job:latest}
    build:
      context: .
      dockerfile: internal/durablejob/Dockerfile
      target: production
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DOCKER_DB_PORT: ${DOCKER_DB_PORT}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-notezy-kafka:9092}
      KAFKA_DIAL_TIMEOUT: ${KAFKA_DIAL_TIMEOUT:-3s}
      KAFKA_TLS_ENABLED: ${KAFKA_TLS_ENABLED:-false}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      DURABLEJOB_LISTEN_ADDRESS: 0.0.0.0:8082
      KAFKA_CONSUMER_MAXIMUM_ATTEMPTS: ${KAFKA_CONSUMER_MAXIMUM_ATTEMPTS:-3}
      KAFKA_CONSUMER_INITIAL_RETRY_BACKOFF: ${KAFKA_CONSUMER_INITIAL_RETRY_BACKOFF:-250ms}
      KAFKA_CONSUMER_MAXIMUM_RETRY_BACKOFF: ${KAFKA_CONSUMER_MAXIMUM_RETRY_BACKOFF:-5s}
      KAFKA_CONSUMER_MAXIMUM_POLL_RECORDS: ${KAFKA_CONSUMER_MAXIMUM_POLL_RECORDS:-100}
      DURABLEJOB_YJS_MAINTENANCE_MAXIMUM_PENDING_HINTS: ${DURABLEJOB_YJS_MAINTENANCE_MAXIMUM_PENDING_HINTS:-1000}
      DURABLEJOB_YJS_MAINTENANCE_MAXIMUM_DISPATCH_BATCH: ${DURABLEJOB_YJS_MAINTENANCE_MAXIMUM_DISPATCH_BATCH:-32}
      DURABLEJOB_YJS_MAINTENANCE_MAXIMUM_DISPATCH_WORKERS: ${DURABLEJOB_YJS_MAINTENANCE_MAXIMUM_DISPATCH_WORKERS:-8}
      DURABLEJOB_YJS_MAINTENANCE_MAXIMUM_REQUEST_ATTEMPTS: ${DURABLEJOB_YJS_MAINTENANCE_MAXIMUM_REQUEST_ATTEMPTS:-3}
      OTEL_SERVICE_NAME: notezy-durable-job
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-unknown}
      OTEL_DEPLOYMENT_ENVIRONMENT: production
      OTEL_EXPORTER_OTLP_GRPC_ENDPOINT: ${OTEL_EXPORTER_OTLP_GRPC_ENDPOINT}
    expose:
      - "8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8082/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      notezy-db:
        condition: service_healthy
      notezy-core:
        condition: service_healthy
      notezy-yjs-worker:
        condition: service_healthy

  notezy-email:
    container_name: ${DOCKER_EMAIL_SERVICE_NAME:-notezy-email}
    image: ${EMAIL_IMAGE:-notezy-email:latest}
    build:
      context: .
      dockerfile: internal/email/Dockerfile
      target: production
    environment:
      EMAIL_LISTEN_ADDRESS: 0.0.0.0:8081
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      NOTEZY_OFFICIAL_NAME: ${NOTEZY_OFFICIAL_NAME}
      NOTEZY_OFFICIAL_GMAIL: ${NOTEZY_OFFICIAL_GMAIL}
      NOTEZY_OFFICIAL_GOOGLE_PASSWORD: ${NOTEZY_OFFICIAL_GOOGLE_PASSWORD}
      NOTEZY_OFFICIAL_GOOGLE_APPLICATION_PASSWORD: ${NOTEZY_OFFICIAL_GOOGLE_APPLICATION_PASSWORD}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_DIAL_TIMEOUT: ${KAFKA_DIAL_TIMEOUT:-3s}
      KAFKA_TLS_ENABLED: ${KAFKA_TLS_ENABLED:-false}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      KAFKA_CONSUMER_MAXIMUM_ATTEMPTS: ${KAFKA_CONSUMER_MAXIMUM_ATTEMPTS:-3}
      KAFKA_CONSUMER_INITIAL_RETRY_BACKOFF: ${KAFKA_CONSUMER_INITIAL_RETRY_BACKOFF:-250ms}
      KAFKA_CONSUMER_MAXIMUM_RETRY_BACKOFF: ${KAFKA_CONSUMER_MAXIMUM_RETRY_BACKOFF:-5s}
      KAFKA_CONSUMER_MAXIMUM_POLL_RECORDS: ${KAFKA_CONSUMER_MAXIMUM_POLL_RECORDS:-100}
      OTEL_SERVICE_NAME: notezy-email
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-unknown}
      OTEL_DEPLOYMENT_ENVIRONMENT: production
      OTEL_EXPORTER_OTLP_GRPC_ENDPOINT: ${OTEL_EXPORTER_OTLP_GRPC_ENDPOINT}
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
  notezy-yjs-worker:
    image: ${YJS_WORKER_IMAGE:-notezy-yjs-worker:latest}
    build:
      context: .
      dockerfile: internal/yjsworker/Dockerfile
    environment:
      NODE_ENV: production
      YJS_WORKER_HOST: 0.0.0.0
      YJS_WORKER_PORT: ${DOCKER_YJS_WORKER_PORT:-8787}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_CLIENT_ID: notezy-yjs-worker
      YJS_WORKER_COMMAND_TIMEOUT_MILLISECONDS: ${YJS_WORKER_COMMAND_TIMEOUT_MILLISECONDS:-10000}
      OTEL_SERVICE_NAME: notezy-yjs-worker
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-unknown}
      OTEL_DEPLOYMENT_ENVIRONMENT: production
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
    expose:
      - "${DOCKER_YJS_WORKER_PORT:-8787}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + process.env.YJS_WORKER_PORT + '/healthz').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  notezy-nginx:
    image: nginx:1.27-alpine
    container_name: ${DOCKER_NGINX_SERVICE_NAME}
    depends_on:
      notezy-gateway:
        condition: service_healthy
      notezy-realtime-gateway:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT}:${DOCKER_NGINX_HTTP_PORT}"
      - "${NGINX_HTTPS_PORT}:${DOCKER_NGINX_HTTPS_PORT}"
    volumes:
      - ./infra/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro

volumes:
  redis-data:
    name: notezy-backend-redis-data
  postgres-data:
    name: notezy-backend-postgres-data
