groups:
  - name: notezy-notification
    rules:
      - alert: NotezyKafkaDeadLetterRateHigh
        expr: sum(rate(notezy_kafka_dlq_count_total{messaging_destination_name=~"notezy.core.notification.v1|notezy.core.lifecycle.v1|notezy.notification.v1"}[5m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Notification-related Kafka events are being sent to a dead-letter topic.
      - alert: NotezyKafkaConsumerLagHigh
        expr: max(notezy_kafka_consumer_lag{messaging_destination_name=~"notezy.core.notification.v1|notezy.core.lifecycle.v1|notezy.notification.v1"}) > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Notification-related Kafka consumer lag is above 1000 records.
