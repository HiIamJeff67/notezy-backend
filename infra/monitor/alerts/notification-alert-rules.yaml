groups:
  - name: notegic-notification
    rules:
      - alert: NotegicKafkaDeadLetterRateHigh
        expr: sum(rate(notegic_kafka_dlq_count_total{messaging_destination_name=~"notegic.core.notification.v1|notegic.core.lifecycle.v1|notegic.notification.v1"}[5m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Notification-related Kafka events are being sent to a dead-letter topic.
      - alert: NotegicKafkaConsumerLagHigh
        expr: max(notegic_kafka_consumer_lag{messaging_destination_name=~"notegic.core.notification.v1|notegic.core.lifecycle.v1|notegic.notification.v1"}) > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Notification-related Kafka consumer lag is above 1000 records.
